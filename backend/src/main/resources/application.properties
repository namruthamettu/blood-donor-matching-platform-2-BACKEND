```properties
spring.application.name=blood-donor-platform
server.port=${SERVER_PORT:8888}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lifelinkdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keep the database console disabled in deployment
spring.h2.console.enabled=false

# Do not expose internal server errors
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
```